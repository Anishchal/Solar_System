<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Solar System Simulation — 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #020308;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    #ui-container {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(13, 20, 36, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #38bdf8;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      flex-wrap: wrap;
    }

    button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #334155;
      border-color: #64748b;
    }

    input[type="range"] {
      accent-color: #38bdf8;
      cursor: pointer;
      width: 90px;
    }

    select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    #info-card {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 320px;
      max-height: calc(100vh - 32px);
      background: rgba(13, 20, 36, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 14px;
      padding: 18px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
      animation: fadeIn 0.25s ease-out;
      overflow-y: auto;
    }

    #info-card::-webkit-scrollbar {
      width: 5px;
    }

    #info-card::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.3);
      border-radius: 4px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #info-card .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 6px;
    }

    #info-card h2 {
      font-size: 1.3rem;
      color: #f1f5f9;
    }

    .badge-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #info-card .badge {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: inline-block;
      width: fit-content;
    }

    #info-card .close-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.25rem;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    #info-card .close-btn:hover {
      color: #f1f5f9;
    }

    .image-container {
      position: relative;
      width: 100%;
      height: 155px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background-color: #0b1120;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
    }

    #card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s ease, transform 0.4s ease;
    }

    #card-img:hover {
      transform: scale(1.04);
    }

    .image-loader {
      position: absolute;
      font-size: 0.75rem;
      color: #64748b;
      letter-spacing: 0.5px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.07);
      padding: 4px 0;
    }

    .detail-label {
      color: #94a3b8;
    }

    .detail-val {
      font-weight: 500;
      color: #e2e8f0;
      text-align: right;
    }

    .desc {
      font-size: 0.82rem;
      line-height: 1.45;
      color: #cbd5e1;
      margin-top: 4px;
    }

    #hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 20, 36, 0.7);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.75rem;
      color: #94a3b8;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      max-width: 90vw;
    }

    #loading-screen {
      position: absolute;
      inset: 0;
      background: #020308;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 14px;
      transition: opacity 0.5s ease;
    }

    #loading-screen .spinner {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid rgba(56, 189, 248, 0.15);
      border-top-color: #38bdf8;
      animation: spin 0.9s linear infinite;
    }

    #loading-screen .load-text {
      font-size: 0.85rem;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div class="load-text" id="load-text">Loading planetary textures… 0%</div>
  </div>

  <div id="ui-container">
    <div class="title">Solar System Simulation — 3D</div>
    <div class="controls">
      <button id="btn-pause">Pause</button>
      <button id="btn-reset">Reset View</button>
      <label for="speed-slider">Speed:</label>
      <input type="range" id="speed-slider" min="0" max="4" step="0.1" value="1" />
      <label for="focus-select">Focus:</label>
      <select id="focus-select"></select>
    </div>
  </div>

  <div id="info-card">
    <div class="card-header">
      <h2 id="card-title">Body Name</h2>
      <button class="close-btn" id="btn-close">&times;</button>
    </div>

    <div class="badge-container">
      <span class="badge" id="card-type">Planet</span>
    </div>

    <div class="image-container">
      <span class="image-loader" id="img-loader">Loading image...</span>
      <img id="card-img" src="" alt="Celestial Body" referrerpolicy="no-referrer" />
    </div>

    <div id="card-details"></div>
    <p class="desc" id="card-desc"></p>
  </div>

  <div id="hint">Click any Sun, Planet, or Moon to inspect • Drag to orbit • Scroll to zoom • Right-click drag to pan</div>

  <canvas id="space"></canvas>

      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

    /* ---------------------------------------------------------------
       RENDERER / SCENE / CAMERA
    ----------------------------------------------------------------*/
    const canvas = document.getElementById("space");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, logarithmicDepthBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 8000);
    const DEFAULT_CAM_POS = new THREE.Vector3(0, 300, 560);
    camera.position.copy(DEFAULT_CAM_POS);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 12;
    controls.maxDistance = 3000;
    controls.zoomSpeed = 0.9;
    controls.target.set(0, 0, 0);
    controls.update();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ---------------------------------------------------------------
       LIGHTING
    ----------------------------------------------------------------*/
    scene.add(new THREE.AmbientLight(0x30405a, 0.55));
    const sunLight = new THREE.PointLight(0xfff2d6, 6.5, 0, 0.15);
    sunLight.position.set(0, 0, 0);
    scene.add(sunLight);

    /* ---------------------------------------------------------------
       STARFIELD
    ----------------------------------------------------------------*/
    function buildStarfield() {
      const count = 4000;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const palette = [
        [1, 1, 1], [0.8, 0.85, 0.9], [0.99, 0.94, 0.6],
        [0.58, 0.77, 0.99], [0.99, 0.84, 0.68]
      ];
      for (let i = 0; i < count; i++) {
        const r = 1800 + Math.random() * 2200;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.cos(phi);
        positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
        const c = palette[Math.floor(Math.random() * palette.length)];
        const b = 0.6 + Math.random() * 0.4;
        colors[i * 3] = c[0] * b;
        colors[i * 3 + 1] = c[1] * b;
        colors[i * 3 + 2] = c[2] * b;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      const mat = new THREE.PointsMaterial({
        size: 2.1,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        sizeAttenuation: true,
        depthWrite: false
      });
      scene.add(new THREE.Points(geo, mat));
    }
    buildStarfield();

    /* ---------------------------------------------------------------
       TEXTURE LOADING
    ----------------------------------------------------------------*/
    const TEXTURES_DIR = "./";

    const manager = new THREE.LoadingManager();
    const loadText = document.getElementById("load-text");
    const loadingScreen = document.getElementById("loading-screen");

    manager.onProgress = (url, loaded, total) => {
      const pct = Math.round((loaded / total) * 100);
      loadText.textContent = `Loading planetary textures… ${pct}%`;
    };
    manager.onLoad = () => {
      loadingScreen.style.opacity = "0";
      setTimeout(() => (loadingScreen.style.display = "none"), 500);
    };

    const localLoader = new THREE.TextureLoader(manager);
    const remoteLoader = new THREE.TextureLoader();
    remoteLoader.crossOrigin = "anonymous";

    function finalizeTexture(tex) {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      tex.wrapS = THREE.ClampToEdgeWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      return tex;
    }

    function loadTextureWithFallback(localFile, remoteUrl, onReady) {
      localLoader.load(
        TEXTURES_DIR + localFile,
        (tex) => onReady(finalizeTexture(tex)),
        undefined,
        () => {
          remoteLoader.load(
            remoteUrl,
            (tex) => onReady(finalizeTexture(tex)),
            undefined,
            () => console.warn("Texture unavailable locally and remotely:", localFile, remoteUrl)
          );
        }
      );
    }

    // Procedural ring texture (Saturn)
    function makeRingTexture() {
      const size = 256;
      const c = document.createElement("canvas");
      c.width = 1;
      c.height = size;
      const ctx = c.getContext("2d");
      const grad = ctx.createLinearGradient(0, 0, 0, size);
      grad.addColorStop(0.0, "rgba(217,180,120,0.0)");
      grad.addColorStop(0.1, "rgba(217,180,120,0.55)");
      grad.addColorStop(0.32, "rgba(254,240,180,0.85)");
      grad.addColorStop(0.48, "rgba(20,15,5,0.1)");
      grad.addColorStop(0.53, "rgba(10,8,4,0.9)");
      grad.addColorStop(0.58, "rgba(20,15,5,0.15)");
      grad.addColorStop(0.78, "rgba(217,180,120,0.65)");
      grad.addColorStop(1.0, "rgba(217,180,120,0.1)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1, size);
      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }

    /* ---------------------------------------------------------------
       BUILD SUN
    ----------------------------------------------------------------*/
    const sunGeo = new THREE.SphereGeometry(celestialData.radius, 64, 64);
    const sunMat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      side: THREE.DoubleSide
    });
    const sunMesh = new THREE.Mesh(sunGeo, sunMat);
    scene.add(sunMesh);

    // Rendered via sun1.jpeg
    loadTextureWithFallback(celestialData.renderFile || `${celestialData.name.toLowerCase()}1.jpeg`, celestialData.image, (tex) => {
      sunMat.map = tex;
      sunMat.needsUpdate = true;
    });

    const glowGeo = new THREE.SphereGeometry(celestialData.radius * 1.25, 32, 32);
    const glowMat = new THREE.MeshBasicMaterial({
      color: 0xffaa33,
      transparent: true,
      opacity: 0.22,
      side: THREE.BackSide,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const glowMesh = new THREE.Mesh(glowGeo, glowMat);
    scene.add(glowMesh);

    celestialData.mesh = sunMesh;

    /* ---------------------------------------------------------------
       BUILD PLANETS + MOONS + RINGS + ORBIT PATHS
    ----------------------------------------------------------------*/
    const pickables = [{ mesh: sunMesh, data: celestialData }];
    const focusSelect = document.getElementById("focus-select");
    addFocusOption("Sun", celestialData);

    function makeOrbitLine(dist, color = 0x7dd3fc, opacity = 0.15) {
      const segments = 128;
      const pts = [];
      for (let i = 0; i <= segments; i++) {
        const a = (i / segments) * Math.PI * 2;
        pts.push(new THREE.Vector3(Math.cos(a) * dist, 0, Math.sin(a) * dist));
      }
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
      return new THREE.LineLoop(geo, mat);
    }

    function addFocusOption(label, dataRef) {
      const opt = document.createElement("option");
      opt.value = label;
      opt.textContent = label;
      focusSelect.appendChild(opt);
      dataRef._focusLabel = label;
    }

    for (const p of celestialData.planets) {
      scene.add(makeOrbitLine(p.dist));

      const geo = new THREE.SphereGeometry(p.radius, 48, 48);
      const mat = new THREE.MeshStandardMaterial({
        color: p.color || 0xffffff,
        roughness: 0.95,
        metalness: 0.02
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.z = THREE.MathUtils.degToRad(Math.random() * 8);
      scene.add(mesh);
      p.mesh = mesh;

      // Render 3D planet sphere using [planet]1.jpeg
      const planetRenderFile = p.renderFile || `${p.name.toLowerCase()}1.jpeg`;
      loadTextureWithFallback(planetRenderFile, p.image, (tex) => {
        mat.map = tex;
        mat.color.set(0xffffff);
        mat.needsUpdate = true;
      });

      if (p.atmosphere) {
        const atmoGeo = new THREE.SphereGeometry(p.radius * 1.12, 32, 32);
        const atmoMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(p.atmosphere),
          transparent: true,
          opacity: 0.18,
          side: THREE.BackSide,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        p.atmoMesh = new THREE.Mesh(atmoGeo, atmoMat);
        scene.add(p.atmoMesh);
      }

      if (p.hasRings) {
        const ringGeo = new THREE.RingGeometry(p.ringInner, p.ringOuter, 128, 1);
        const ringMat = new THREE.MeshBasicMaterial({
          map: makeRingTexture(),
          side: THREE.DoubleSide,
          transparent: true,
          depthWrite: false
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2 + THREE.MathUtils.degToRad(-26.7);
        scene.add(ring);
        p.ringMesh = ring;
      }

      pickables.push({ mesh, data: p });
      addFocusOption(p.name, p);

      p.moonObjs = [];
      for (const m of p.moons) {
        const mGeo = new THREE.SphereGeometry(m.radius, 32, 32);
        const mMat = new THREE.MeshStandardMaterial({
          color: 0xcccccc,
          roughness: 1,
          metalness: 0
        });
        const mMesh = new THREE.Mesh(mGeo, mMat);
        scene.add(mMesh);
        m.mesh = mMesh;

        // Render moons via renderFile or [moon]1.jpeg fallback
        const moonRenderFile = m.renderFile || `${m.name.toLowerCase().split(' ')[0]}1.jpeg`;
        loadTextureWithFallback(moonRenderFile, m.image, (tex) => {
          mMat.map = tex;
          mMat.color.set(0xffffff);
          mMat.needsUpdate = true;
        });

        pickables.push({ mesh: mMesh, data: m });
        addFocusOption(`${m.name} (${p.name})`, m);
      }
    }

    /* ---------------------------------------------------------------
       SELECTION HIGHLIGHT RING
    ----------------------------------------------------------------*/
    const selectGeo = new THREE.SphereGeometry(1, 20, 14);
    const selectMat = new THREE.MeshBasicMaterial({
      color: 0x38bdf8,
      wireframe: true,
      transparent: true,
      opacity: 0.55
    });
    const selectMesh = new THREE.Mesh(selectGeo, selectMat);
    selectMesh.visible = false;
    scene.add(selectMesh);

    let selected = null;

    /* ---------------------------------------------------------------
       ANIMATION LOOP
    ----------------------------------------------------------------*/
    let isPaused = false;
    let simSpeed = 1;
    let animTime = 0;
    let focusTarget = null;

    function animate() {
      requestAnimationFrame(animate);

      if (!isPaused) {
        animTime += 0.016 * simSpeed;
        sunMesh.rotation.y += 0.0009 * simSpeed;
      }

      if (glowMesh) glowMesh.position.copy(sunMesh.position);

      for (const p of celestialData.planets) {
        if (!isPaused) p.angle += p.speed * simSpeed * 0.4;
        const x = Math.cos(p.angle) * p.dist;
        const z = Math.sin(p.angle) * p.dist;
        p.mesh.position.set(x, 0, z);
        if (!isPaused) p.mesh.rotation.y += 0.006 * simSpeed;

        if (p.atmoMesh) p.atmoMesh.position.set(x, 0, z);
        if (p.ringMesh) p.ringMesh.position.set(x, 0, z);

        for (const m of p.moons) {
          if (!isPaused) m.angle += m.speed * simSpeed * 0.8;
          const mx = x + Math.cos(m.angle) * m.dist;
          const mz = z + Math.sin(m.angle) * m.dist;
          m.mesh.position.set(mx, 0, mz);
          if (!isPaused) m.mesh.rotation.y += 0.01 * simSpeed;
        }
      }

      if (selected) {
        selectMesh.position.copy(selected.mesh.position);
        const pulse = 1 + Math.sin(animTime * 3) * 0.03;
        selectMesh.scale.setScalar(selected.data.radius * 1.4 * pulse);
      }

      if (focusTarget) {
        controls.target.lerp(focusTarget.mesh.position, 0.08);
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    /* ---------------------------------------------------------------
       RAYCAST CLICK SELECTION
    ----------------------------------------------------------------*/
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let downPos = null;

    renderer.domElement.addEventListener("pointerdown", (e) => {
      downPos = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener("pointerup", (e) => {
      if (!downPos) return;
      const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
      downPos = null;
      if (dist > 5) return;

      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const meshes = pickables.map((p) => p.mesh);
      const hits = raycaster.intersectObjects(meshes, false);

      if (hits.length > 0) {
        const hitMesh = hits[0].object;
        const found = pickables.find((p) => p.mesh === hitMesh);
        if (found) {
          selectBody(found);
        }
      } else {
        deselectBody();
      }
    });

    function selectBody(entity) {
      selected = entity;
      selectMesh.visible = true;
      showInfoCard(entity.data);
      focusSelect.value = entity.data._focusLabel || "";
    }

    function deselectBody() {
      selected = null;
      selectMesh.visible = false;
      hideInfoCard();
    }

    /* ---------------------------------------------------------------
       UI WIRING (IMAGE & INFO CARD)
    ----------------------------------------------------------------*/
    const infoCard = document.getElementById("info-card");
    const cardTitle = document.getElementById("card-title");
    const cardType = document.getElementById("card-type");
    const cardDetails = document.getElementById("card-details");
    const cardDesc = document.getElementById("card-desc");
    const cardImg = document.getElementById("card-img");
    const imgLoader = document.getElementById("img-loader");

    function showInfoCard(data) {
      cardTitle.textContent = data.name;
      cardType.textContent = data.type;
      cardDesc.textContent = data.desc;

      // Card uses cardImage (e.g. earth.jpg), falling back to renderFile or remote image
      const imageFileName = data.cardImage || data.renderFile;
      const primarySrc = imageFileName ? `./${imageFileName}` : data.image;

      if (primarySrc) {
        imgLoader.style.display = "block";
        imgLoader.textContent = "Loading image...";
        cardImg.style.opacity = "0";

        cardImg.onload = () => {
          imgLoader.style.display = "none";
          cardImg.style.opacity = "1";
        };

        cardImg.onerror = () => {
          if (data.image && cardImg.src !== data.image) {
            cardImg.src = data.image;
          } else {
            imgLoader.textContent = "Image unavailable";
            cardImg.style.opacity = "0";
          }
        };

        cardImg.src = primarySrc;
        cardImg.alt = data.name;
      }

      cardDetails.innerHTML = "";
      for (const [key, val] of Object.entries(data.info)) {
        const row = document.createElement("div");
        row.className = "detail-row";
        row.innerHTML = `<span class="detail-label">${key}</span><span class="detail-val">${val}</span>`;
        cardDetails.appendChild(row);
      }

      infoCard.style.display = "flex";
    }

    function hideInfoCard() {
      infoCard.style.display = "none";
    }

    document.getElementById("btn-close").addEventListener("click", deselectBody);

    const btnPause = document.getElementById("btn-pause");
    btnPause.addEventListener("click", () => {
      isPaused = !isPaused;
      btnPause.textContent = isPaused ? "Play" : "Pause";
    });

    const speedSlider = document.getElementById("speed-slider");
    speedSlider.addEventListener("input", (e) => {
      simSpeed = parseFloat(e.target.value);
    });

    document.getElementById("btn-reset").addEventListener("click", () => {
      focusTarget = null;
      camera.position.copy(DEFAULT_CAM_POS);
      controls.target.set(0, 0, 0);
      controls.update();
      focusSelect.value = "Sun";
    });

    focusSelect.addEventListener("change", (e) => {
      const label = e.target.value;
      const entity = pickables.find((p) => p.data._focusLabel === label);
      if (entity) {
        focusTarget = entity;
        selectBody(entity);
      }
    });
  </script>
</body>
</html>
